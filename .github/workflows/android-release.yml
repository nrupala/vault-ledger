name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
      - "apk-v*"
  workflow_dispatch:

permissions:
  contents: write # needed to publish the GitHub Release on tag

env:
  # Family release-certificate fingerprint (SHA-256, no colons).
  # The child repos do not define a VAULT_CERT_SHA256 repository variable,
  # so the expected fingerprint is pinned here, in the workflow itself.
  VAULT_CERT_SHA256: b0932c0d2e653a15dc0662186fc4bb73e8a4c8ef849dcfb27ba60db67d417d33

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version (standard)
        if: github.ref_type == 'tag'
        run: |
          TAG_VER="${{GITHUB_REF_NAME#apk-v}}"; TAG_VER="${{TAG_VER#v}}"
          PKG_VER="$(node -p "require(\"./package.json\").version")"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Tag ${{GITHUB_REF_NAME}} (=${{TAG_VER}}) does not match package.json version ${{PKG_VER}}."
            exit 1
          fi
          echo "version guard OK: ${{PKG_VER}}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync & Build Capacitor
        run: |
          npx cap sync android

      - name: Stamp native version from tag (standard)
        run: bash scripts/stamp-app-version.sh

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vault-ledger-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk


      - name: Decode release keystore (AAB)
        run: |
          if [ -z "${{ secrets.VAULT_KEYSTORE_BASE64 }}" ]; then
            echo "::error::VAULT_KEYSTORE_BASE64 secret is missing - release AAB builds must be signed with the family key"
            exit 1
          fi
          echo "${{ secrets.VAULT_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/vault-release.p12"

      - name: Build Android App Bundle (release)
        env:
          VAULT_KEYSTORE_FILE: ${{ runner.temp }}/vault-release.p12
          VAULT_KEYSTORE_PASSWORD: <redacted>
          VAULT_KEY_PASSWORD: <redacted>
          VAULT_KEY_ALIAS: vault
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Verify AAB signature
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB" | tee /tmp/aab-cert.txt
          ACTUAL=$(grep -i "SHA256:" /tmp/aab-cert.txt | head -1 | sed 's/.*SHA256://' | tr -d ' : ' | tr 'A-F' 'a-f')
          EXPECTED=$(echo "$VAULT_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          echo "AAB signer sha256: $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::AAB signer certificate mismatch - refusing this build"
            exit 1
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vault-ledger-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: vault-ledger ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
