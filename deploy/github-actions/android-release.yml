name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
      - "apk-v*"
  workflow_dispatch:

permissions:
  contents: write # needed to publish the GitHub Release on tag

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version (standard)
        if: github.ref_type == 'tag'
        run: |
          TAG_VER="${{GITHUB_REF_NAME#apk-v}}"; TAG_VER="${{TAG_VER#v}}"
          PKG_VER="$(node -p "require(\"./package.json\").version")"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Tag ${{GITHUB_REF_NAME}} (=${{TAG_VER}}) does not match package.json version ${{PKG_VER}}."
            exit 1
          fi
          echo "version guard OK: ${{PKG_VER}}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync & Build Capacitor
        run: |
          npx cap sync android

      - name: Stamp native version from tag (standard)
        run: bash scripts/stamp-app-version.sh

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vault-ledger-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: vault-ledger ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
